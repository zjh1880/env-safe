---
name: Bug report
description: Report a validation bug or unexpected CLI behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: env-safe version
      placeholder: 1.1.0
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Include the command, the example file content, and the actual output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
---
